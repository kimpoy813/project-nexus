{% extends "layouts/auth.html" %}
{% block title %}Password updated - {{ site_control.site_name|default:"NExUS" }}{% endblock %}

{% block auth_content %}
<div class="nx-auth__card text-center">
    <h1 class="text-xl font-extrabold m-0" style="color: var(--nx-text);">Password updated</h1>
    <p class="text-sm mt-2 mb-6" style="color: var(--nx-muted);">Your password has been changed successfully.</p>
    <a href="{% url 'login' %}" class="nx-btn nx-btn--primary">Back to sign in</a>
</div>
{% endblock %}
