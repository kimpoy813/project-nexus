{% extends "layouts/app.html" %}
{% block title %}Check your email - {{ site_control.site_name|default:"NExUS" }}{% endblock %}

{% block app_content %}
<div class="nx-card" style="max-width: 34rem; margin: 2rem auto;">
    <div class="nx-card__body text-center">
        <h1 class="text-xl font-extrabold m-0" style="color: var(--nx-text);">Check your email</h1>
        <p class="text-sm mt-2 mb-6" style="color: var(--nx-muted);">
            We sent a password reset link to <strong>{{ email }}</strong>.
        </p>
        <a href="{% url 'profile_view' %}" class="nx-btn nx-btn--primary">Back to Profile</a>
    </div>
</div>
{% endblock %}
