{% extends "layouts/auth.html" %}
{% block title %}Check your email - {{ site_control.site_name|default:"NExUS" }}{% endblock %}

{% block auth_content %}
<div class="nx-auth__card text-center">
    <h1 class="text-xl font-extrabold m-0" style="color: var(--nx-text);">Check your email</h1>
    <p class="text-sm mt-2 mb-6" style="color: var(--nx-muted);">
        If that email exists in the system, a reset link is on its way.
    </p>
    <a href="{% url 'login' %}" class="nx-btn nx-btn--primary">Back to sign in</a>
</div>
{% endblock %}
