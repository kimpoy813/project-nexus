<div>
  {% if field.field.widget.input_type == 'checkbox' %}
  <label for="{{ field.id_for_label }}" class="inline-flex items-center gap-2 text-sm font-medium text-gray-700">
    {{ field }} {{ field.label }}
  </label>
  {% else %}
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
    {{ field.label }}{% if field.field.required %}<span class="text-red-700" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="mt-1 text-xs text-gray-500">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul id="{{ field.auto_id }}_error" class="mt-1 text-sm text-red-700">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
