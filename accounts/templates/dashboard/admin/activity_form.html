{% extends "layouts/app.html" %}
{% block app_content %}
<div class="space-y-5">
    <h1 class="text-2xl font-bold mb-6">{% if activity %}Edit{% else %}Add{% endif %} Activity</h1>

    <form method="POST" enctype="multipart/form-data" class="bg-white border rounded-xl p-6 space-y-4">
        {% csrf_token %}

        <div>
        <label class="block text-sm font-medium mb-1">Title</label>
        <input name="title" value="{{ activity.title|default:'' }}" class="nx-input" required>
        </div>

        <div>
        <label class="block text-sm font-medium mb-1">Description</label>
        <textarea name="description" class="nx-input" rows="4" required>{{ activity.description|default:'' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium">Dates (you can add multiple)</label>

            <div id="datesWrap" class="space-y-2 mt-2">
                {% if activity %}
                {% for d in activity.dates.all %}
                    <div class="flex gap-2">
                    <input type="date" name="dates[]" value="{{ d.date|date:'Y-m-d' }}" class="nx-input flex-1" required>
                    <button type="button" class="nx-btn" onclick="this.parentElement.remove()">Remove</button>
                    </div>
                {% endfor %}
                {% endif %}

                {% if not activity or activity.dates.count == 0 %}
                <div class="flex gap-2">
                    <input type="date" name="dates[]" class="nx-input flex-1" required>
                    <button type="button" class="nx-btn" onclick="this.parentElement.remove()">Remove</button>
                </div>
                {% endif %}
            </div>

            <button type="button" class="nx-btn mt-2" onclick="addDate()">+ Add another date</button>
        </div>

        <script>
            function addDate(){
            const wrap = document.getElementById('datesWrap');
            const row = document.createElement('div');
            row.className = 'flex gap-2';
            row.innerHTML = `
                <input type="date" name="dates[]" class="nx-input flex-1" required>
                <button type="button" class="nx-btn" onclick="this.parentElement.remove()">Remove</button>
            `;
            wrap.appendChild(row);
            }
        </script>

        <div>
        <label class="block text-sm font-medium mb-1">Image</label>
        <input type="file" name="image" class="w-full">
        </div>

        <div class="flex items-center gap-2">
        <label class="relative inline-flex items-center cursor-pointer select-none">
            <input type="checkbox" name="active" {% if activity and activity.active %}checked{% endif %} class="sr-only peer">
            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
            <span class="ml-3 text-sm font-semibold text-gray-700">Active</span>
        </label>
        </div>

        <div class="flex gap-3">
        <button class="nx-btn nx-btn--primary" type="submit">Save</button>
        <a class="nx-btn" href="{% url 'activities_list' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
