<script>
function addActivityDate(containerId){
    const c=document.getElementById(containerId);
    if(!c) return;
    const w=document.createElement('div');
    w.className='flex gap-2 items-center';
    w.innerHTML='<input type="date" name="dates[]" class="pc-input" style="max-width:240px"> <button type="button" onclick="this.parentElement.remove()" class="text-xs text-red-600 hover:underline">Remove</button>';
    c.appendChild(w);
}
function addProcessStep(containerId){
    const c=document.getElementById(containerId);
    if(!c) return;
    const w=document.createElement('div');
    w.className='flex gap-2 items-center';
    w.innerHTML='<input type="hidden" name="step_id[]" value=""><input type="text" name="step_description[]" placeholder="New step…" class="pc-input flex-1"> <input type="number" name="step_order[]" placeholder="Order" class="pc-input w-20"> <button type="button" onclick="this.parentElement.remove()" class="text-xs text-red-600 hover:underline">Remove</button>';
    c.appendChild(w);
}
</script>
