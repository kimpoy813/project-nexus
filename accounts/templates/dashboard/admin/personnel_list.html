{% extends "dashboard/dashboard_base.html" %}
{% block content %}
<div class="nx-page py-6">
    <div class="flex items-center justify-between mb-6 nx-page-header">
        <h1 class="text-2xl font-bold nx-page-title">Personnel</h1>
        <a href="{% url 'personnel_create' %}" title="Add Personnel" class="bg-primary text-white p-2.5 rounded-xl hover:bg-secondary transition flex items-center justify-center shadow-sm nx-btn nx-btn--primary nx-btn--icon">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
        </a>
    </div>

    <div class="bg-white border rounded-xl overflow-hidden nx-panel">
        <table class="min-w-full nx-table">
        <thead class="bg-gray-50">
            <tr>
            <th class="text-left p-3">Name</th>
            <th class="text-left p-3">Position</th>
            <th class="text-left p-3">Email</th>
            <th class="text-left p-3">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for p in personnel %}
            <tr class="border-t">
            <td class="p-3">{{ p.name }}</td>
            <td class="p-3">{{ p.position }}</td>
            <td class="p-3">{{ p.email }}</td>
            <td class="p-3">
                <div class="nx-actions">
                  <a href="{% url 'personnel_edit' p.id %}"
                     class="nx-btn nx-btn--secondary nx-btn--icon nx-btn--compact"
                     data-nx-tooltip="Edit personnel" aria-label="Edit personnel">
                    <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-edit"></use></svg>
                  </a>
                  <a href="{% url 'personnel_delete' p.id %}"
                     class="nx-btn nx-btn--danger nx-btn--icon nx-btn--compact"
                     data-nx-tooltip="Delete personnel" aria-label="Delete personnel"
                     onclick="return confirm('Delete this personnel record? This cannot be undone.');">
                    <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-trash"></use></svg>
                  </a>
                </div>
            </td>
            </tr>
            {% empty %}
            <tr><td class="p-6 text-gray-500" colspan="4">No personnel yet.</td></tr>
            {% endfor %}
        </tbody>
        </table>
    </div>

</div>

{% endblock %}
