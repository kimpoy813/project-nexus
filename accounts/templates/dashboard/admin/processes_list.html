{% extends "base.html" %}
{% block content %}
<div class="nx-page py-8">
    {% if back_url %}
    <a href="{{ back_url }}" class="text-xs font-medium text-slate-500 hover:text-primary">← Back to page editor</a>
    {% endif %}
    <div class="flex items-center justify-between mb-4 {% if back_url %}mt-1{% endif %}">
        <h1 class="nx-dash__title">Processes</h1>
        <a href="{% url 'process_create' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="px-4 py-2 rounded bg-primary text-white">Add Process</a>
    </div>

    <div class="bg-white border rounded-lg overflow-hidden">
        <table class="w-full">
        <thead class="bg-gray-50">
            <tr>
            <th class="text-left p-3">Title</th>
            <th class="text-left p-3">Order</th>
            <th class="text-left p-3">Steps</th>
            <th class="text-left p-3">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for p in processes %}
            <tr class="border-t">
            <td class="p-3">{{ p.title }}</td>
            <td class="p-3">{{ p.order }}</td>
            <td class="p-3">{{ p.steps.count }}</td>
            <td class="p-3 space-x-2">
                <a class="text-primary font-semibold hover:text-secondary transition" href="{% url 'process_edit' p.id %}{% if next %}?next={{ next|urlencode }}{% endif %}">Edit</a>
                <a class="nx-link nx-link--danger" href="{% url 'process_delete' p.id %}{% if next %}?next={{ next|urlencode }}{% endif %}">Delete</a>
            </td>
            </tr>
            {% empty %}
            <tr><td class="p-3" colspan="4">No processes yet.</td></tr>
            {% endfor %}
        </tbody>
        </table>
    </div>
</div>

{% endblock %}
