{% extends "dashboard/dashboard_base.html" %}
{% load static %}
{% block content %}
<div class="nx-page py-6">
    <h1 class="text-2xl font-bold mb-4">{% if process %}Edit{% else %}Add{% endif %} Process</h1>

    <form method="POST" class="bg-white border rounded-lg p-4 space-y-3">
        {% csrf_token %}

        <div>
        <label class="block text-sm font-medium">Title</label>
        <input name="title" value="{{ process.title|default:'' }}" class="w-full border rounded p-2" required>
        </div>

        <p id="process-order-status" class="text-sm text-gray-600 mt-2" aria-live="polite">Steps (drag to reorder):</p>

        <div id="stepsList" class="space-y-2">
        {% if process %}
            {% for s in process.steps.all %}
            <div class="flex gap-2 items-center p-2 border rounded bg-white" data-step-id="{{ s.id }}">
                <span class="cursor-move px-2 select-none">☰</span>
                <input type="hidden" name="step_id[]" value="{{ s.id }}">
                <input name="step_description[]" value="{{ s.description }}" class="flex-1 border rounded p-2">
                <button type="button" class="px-3 py-2 border rounded" onclick="this.closest('[data-step-id]').remove()">Remove</button>
            </div>
            {% endfor %}
        {% endif %}

        <!-- New step row (no id) -->
        <div class="flex gap-2 items-center p-2 border rounded bg-white" data-step-id="">
            <span class="cursor-move px-2 select-none">☰</span>
            <input type="hidden" name="step_id[]" value="">
            <input name="step_description[]" placeholder="New step description" class="flex-1 border rounded p-2">
            <button type="button" class="px-3 py-2 border rounded" onclick="this.closest('[data-step-id]').remove()">Remove</button>
        </div>
        </div>

        <button type="button" class="mt-2 px-3 py-2 border rounded" onclick="addStep()">+ Add Step</button>

        <div class="flex gap-2 pt-2">
        <button class="px-4 py-2 bg-primary text-white rounded" type="submit">Save</button>
        <a class="px-4 py-2 border rounded" href="{% url 'processes_list' %}">Back</a>
        </div>
    </form>
    </div>

    <!-- Load Sortable ONCE -->
    <script src="{% static 'vendor/sortable.min.js' %}"></script>

    <script>
    function addStep() {
        const wrap = document.getElementById('stepsList');
        const div = document.createElement('div');
        div.className = 'flex gap-2 items-center p-2 border rounded bg-white';
        div.setAttribute('data-step-id', '');
        div.innerHTML = `
        <span class="cursor-move px-2 select-none">☰</span>
        <input type="hidden" name="step_id[]" value="">
        <input name="step_description[]" placeholder="New step description" class="flex-1 border rounded p-2">
        <button type="button" class="px-3 py-2 border rounded" onclick="this.closest('[data-step-id]').remove()">Remove</button>
        `;
        wrap.appendChild(div);
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
            }
        }
        }
        return cookieValue;
    }

    const stepsList = document.getElementById('stepsList');
    const orderStatus = document.getElementById('process-order-status');
    let previousStepOrder = [];

    function setOrderStatus(message, kind) {
        if (!orderStatus) return;
        orderStatus.textContent = message;
        orderStatus.className = 'text-sm mt-2 ' + (
            kind === 'ok' ? 'text-green-700'
            : kind === 'err' ? 'text-red-700'
            : 'text-gray-600'
        );
    }

    function showToast(type, message) {
        const toaster = window.goeyToast;
        if (toaster && typeof toaster[type] === 'function') toaster[type](message);
    }

    if (stepsList && typeof Sortable !== 'undefined') {
        new Sortable(stepsList, {
        handle: '.cursor-move',
        animation: 150,
        onStart: function () {
            previousStepOrder = Array.prototype.slice.call(stepsList.children);
        },
        onEnd: async function () {
            {% if process %}
            const rollbackOrder = previousStepOrder.slice();
            const REORDER_URL = "{% url 'reorder_process_steps' process.id %}";
            const csrftoken = getCookie('csrftoken');

            const ids = [...stepsList.querySelectorAll('[data-step-id]')]
                .map(el => el.getAttribute('data-step-id'))
                .filter(id => id); // ignore blank rows (new steps)

            setOrderStatus('Saving step order…');
            try {
                const response = await fetch(REORDER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrftoken
                    },
                    body: JSON.stringify({ step_ids: ids })
                });
                if (!response.ok) throw new Error('Could not save step order.');
                const data = await response.json();
                if (!data || !data.ok) throw new Error('Could not save step order.');

                const successText = 'Step order saved.';
                setOrderStatus(successText, 'ok');
                showToast('success', successText);
            } catch (e) {
                rollbackOrder.forEach(function (row) { stepsList.appendChild(row); });
                const errorText = 'Could not save step order. Your previous order was restored.';
                setOrderStatus(errorText, 'err');
                showToast('error', errorText);
            }
            {% endif %}
        }
        });
    }
    </script>
{% endblock %}
