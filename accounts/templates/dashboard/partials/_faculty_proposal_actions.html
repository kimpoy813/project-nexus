                                {% if item.is_draft %}
                                    <button type="button"
                                            onclick="openDeleteModal('{{ item.proposal.id }}', '{% url 'faculty_delete_draft' item.proposal.id %}', '{{ item.proposal.title|default:item.proposal.research_title|default:'Untitled Proposal'|escapejs }}')"
                                            class="nx-btn nx-btn--danger nx-btn--icon nx-btn--compact"
                                            data-nx-tooltip="Delete draft" aria-label="Delete draft">
                                        <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-trash"></use></svg>
                                    </button>

                                    <a href="{% url 'proposal_wizard' item.proposal.id 1 %}"
                                       class="nx-btn nx-btn--primary nx-btn--icon nx-btn--compact"
                                       data-nx-tooltip="Continue editing draft" aria-label="Continue editing draft">
                                        <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-arrow-right"></use></svg>
                                    </a>
                                {% else %}
                                    <a href="{% url 'proposal_storage' item.proposal.id %}"
                                       class="nx-btn nx-btn--secondary nx-btn--icon nx-btn--compact"
                                       data-nx-tooltip="Open proposal storage" aria-label="Open proposal storage">
                                        <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-folder"></use></svg>
                                    </a>

                                    {% if item.process_label == "MOA" %}
                                        <a href="{% url 'proposal_moa_tracker' item.proposal.id %}"
                                           class="nx-btn nx-btn--primary nx-btn--icon nx-btn--compact"
                                           data-nx-tooltip="View MOA" aria-label="View MOA">
                                            <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-eye"></use></svg>
                                        </a>
                                    {% elif item.process_label == "Implementation" %}
                                        <a href="{% url 'proposal_implementation_tracker' item.proposal.id %}"
                                           class="nx-btn nx-btn--primary nx-btn--icon nx-btn--compact"
                                           data-nx-tooltip="View implementation" aria-label="View implementation">
                                            <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-eye"></use></svg>
                                        </a>
                                    {% else %}
                                        <a href="{% url 'proposal_wizard' item.proposal.id 1 %}"
                                           class="nx-btn nx-btn--primary nx-btn--icon nx-btn--compact"
                                           data-nx-tooltip="View proposal" aria-label="View proposal">
                                            <svg class="nx-icon" aria-hidden="true"><use href="#nx-icon-eye"></use></svg>
                                        </a>
                                    {% endif %}
                                {% endif %}
