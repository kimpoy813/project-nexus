                                {% if item.is_draft %}
                                    <button type="button"
                                            onclick="openDeleteModal('{{ item.proposal.id }}', '{% url 'faculty_delete_draft' item.proposal.id %}', '{{ item.proposal.title|default:item.proposal.research_title|default:'Untitled Proposal'|escapejs }}')"
                                            class="inline-flex items-center justify-center rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 transition hover:border-red-300 hover:bg-red-50 hover:text-red-700">
                                        Delete Draft
                                    </button>

                                    <a href="{% url 'proposal_wizard' item.proposal.id 1 %}"
                                       class="inline-flex items-center rounded-lg bg-primary px-3 py-1.5 text-xs font-medium text-white transition hover:bg-secondary">
                                        Continue
                                    </a>
                                {% else %}
                                    <a href="{% url 'proposal_storage' item.proposal.id %}"
                                       class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 shadow-sm transition hover:border-primary hover:bg-gray-50 hover:text-primary"
                                       title="Proposal storage"
                                       aria-label="Proposal storage">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                            <path d="M4 4a2 2 0 0 1 2-2h4.586A2 2 0 0 1 12 2.586L15.414 6A2 2 0 0 1 16 7.414V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z" />
                                        </svg>
                                    </a>

                                    {% if item.process_label == "MOA" %}
                                        <a href="{% url 'proposal_moa_tracker' item.proposal.id %}"
                                           class="inline-flex items-center gap-2 rounded-lg bg-primary px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-secondary">
                                            View MOA
                                        </a>
                                    {% elif item.process_label == "Implementation" %}
                                        <a href="{% url 'proposal_implementation_tracker' item.proposal.id %}"
                                           class="inline-flex items-center gap-2 rounded-lg bg-primary px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-secondary">
                                            View Implementation
                                        </a>
                                    {% else %}
                                        <a href="{% url 'proposal_wizard' item.proposal.id 1 %}"
                                           class="inline-flex items-center gap-2 rounded-lg bg-primary px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-secondary">
                                            View
                                        </a>
                                    {% endif %}
                                {% endif %}
