{% extends "base.html" %}
{% block title %}Submit Accomplishment Report - NExUS{% endblock %}
{% block content %}
<div class="nx-page py-8">
  <div class="mb-6">
    <p class="text-xs font-black uppercase tracking-[0.18em] text-primary/70">Quarterly Report</p>
    <h1 class="mt-1 text-3xl font-black tracking-tight text-gray-900">Submit Accomplishment Report</h1>
    <p class="mt-2 text-sm text-gray-600">This function is controlled by the Admin Role Capability Matrix.</p>
  </div>
  <form method="post" enctype="multipart/form-data" class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1">Report Title</label>
      <input type="text" name="title" required class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Year</label><input type="number" name="year" value="{{ current_year }}" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Quarter</label><select name="quarter" required class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"><option value="">Select quarter</option>{% for value,label in quarter_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-4">
      <div>
        <label for="id_campus" class="block text-sm font-bold text-gray-700 mb-1">Campus</label>
        <select name="campus" id="id_campus" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm bg-white">
          <option value="">Select campus</option>
          {% for c in campus_choices %}
            <option value="{{ c }}" {% if profile.campus == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="id_college" class="block text-sm font-bold text-gray-700 mb-1">College</label>
        <select name="college" id="id_college" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm bg-white">
          <option value="">Select college (optional)</option>
        </select>
      </div>
      <div>
        <label for="id_department" class="block text-sm font-bold text-gray-700 mb-1">Department</label>
        <select name="department" id="id_department" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm bg-white">
          <option value="">Select department (optional)</option>
        </select>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-4">
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Activities Count</label><input type="number" min="0" name="activities_count" value="0" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Beneficiaries Count</label><input type="number" min="0" name="beneficiaries_count" value="0" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Partners Count</label><input type="number" min="0" name="partners_count" value="0" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
    </div>
    <div><label class="block text-sm font-bold text-gray-700 mb-1">Narrative / Highlights</label><textarea name="narrative" rows="5" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></textarea></div>
    <div><label class="block text-sm font-bold text-gray-700 mb-1">Attachment</label><input type="file" name="attachment" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
    <div class="flex justify-end gap-2 border-t border-gray-100 pt-5">
      <a href="{% url 'accomplishment_reports_list' %}" class="nx-btn">Cancel</a>
      <button type="submit" class="rounded-xl bg-primary px-5 py-2 text-sm font-black text-white">Submit Report</button>
    </div>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const campusSelect = document.getElementById("id_campus");
  const collegeSelect = document.getElementById("id_college");
  const departmentSelect = document.getElementById("id_department");

  const savedCollege = "{{ profile.college|default:''|escapejs }}";
  const savedDepartment = "{{ profile.department|default:''|escapejs }}";

  async function loadColleges(selectedCollege = "") {
    if (!campusSelect || !collegeSelect) return;

    const campus = campusSelect.value;
    collegeSelect.innerHTML = '<option value="">Select college (optional)</option>';
    if (departmentSelect) {
      departmentSelect.innerHTML = '<option value="">Select department (optional)</option>';
    }

    if (!campus) return;

    try {
      const response = await fetch(`{% url 'get_colleges_ajax' %}?campus=${encodeURIComponent(campus)}`);
      const data = await response.json();

      (data.colleges || []).forEach(item => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        if (item.value === selectedCollege) {
          option.selected = true;
        }
        collegeSelect.appendChild(option);
      });
    } catch (error) {
      console.error("Failed to load colleges:", error);
    }
  }

  async function loadDepartments(selectedDepartment = "") {
    if (!campusSelect || !departmentSelect) return;

    const campus = campusSelect.value;
    const college = collegeSelect ? collegeSelect.value : "";

    departmentSelect.innerHTML = '<option value="">Select department (optional)</option>';

    if (!campus) return;

    try {
      const response = await fetch(
        `{% url 'get_departments_ajax' %}?campus=${encodeURIComponent(campus)}&college=${encodeURIComponent(college)}`
      );
      const data = await response.json();

      (data.departments || []).forEach(item => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        if (item.value === selectedDepartment) {
          option.selected = true;
        }
        departmentSelect.appendChild(option);
      });
    } catch (error) {
      console.error("Failed to load departments:", error);
    }
  }

  if (campusSelect) {
    loadColleges(savedCollege).then(() => loadDepartments(savedDepartment));

    campusSelect.addEventListener("change", async function () {
      await loadColleges("");
      await loadDepartments("");
    });

    if (collegeSelect) {
      collegeSelect.addEventListener("change", async function () {
        await loadDepartments("");
      });
    }
  }
});
</script>
{% endblock %}
