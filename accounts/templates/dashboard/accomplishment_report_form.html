{% extends "base.html" %}
{% block title %}Submit Accomplishment Report - NExUS{% endblock %}
{% block content %}
<div class="space-y-5">
  <div class="mb-6">
    <p class="text-xs font-black uppercase tracking-[0.18em] text-primary/70">Quarterly Report</p>
    <h1 class="mt-1 text-3xl font-black tracking-tight text-gray-900">Submit Accomplishment Report</h1>
    <p class="mt-2 text-sm text-gray-600">This function is controlled by the Admin Role Capability Matrix.</p>
  </div>
  <form method="post" enctype="multipart/form-data" class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1">Report Title</label>
      <input type="text" name="title" required class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Year</label><input type="number" name="year" value="{{ current_year }}" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Quarter</label><select name="quarter" required class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"><option value="">Select quarter</option>{% for value,label in quarter_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Campus</label><input type="text" name="campus" value="{{ profile.campus|default:'' }}" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">College</label><input type="text" name="college" value="{{ profile.college|default:'' }}" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Department</label><input type="text" name="department" value="{{ profile.department|default:'' }}" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Activities Count</label><input type="number" min="0" name="activities_count" value="0" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Beneficiaries Count</label><input type="number" min="0" name="beneficiaries_count" value="0" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-bold text-gray-700 mb-1">Partners Count</label><input type="number" min="0" name="partners_count" value="0" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
    </div>
    <div><label class="block text-sm font-bold text-gray-700 mb-1">Narrative / Highlights</label><textarea name="narrative" rows="5" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></textarea></div>
    <div><label class="block text-sm font-bold text-gray-700 mb-1">Attachment</label><input type="file" name="attachment" class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-sm"></div>
    <div class="flex justify-end gap-2 border-t border-gray-100 pt-5">
      <a href="{% url 'accomplishment_reports_list' %}" class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-bold text-gray-700 hover:bg-gray-50">Cancel</a>
      <button type="submit" class="rounded-xl bg-primary px-5 py-2 text-sm font-black text-white hover:bg-secondary">Submit Report</button>
    </div>
  </form>
</div>
{% endblock %}
