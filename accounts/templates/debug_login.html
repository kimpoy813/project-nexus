{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Debug Login - NExUS</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/nexus-tailwind.css' %}" rel="stylesheet">
    <link rel="preload" href="{% static 'fonts/public-sans-latin-variable.woff2' %}" as="font" type="font/woff2" crossorigin>

    <!-- Institutional logo -->
    <link rel="icon" type="image/png" href="{% static 'images/nexus-logo-128.png' %}">

    <link href="{% static 'css/nexus-ui.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md">
            <div class="flex flex-col items-center text-center mb-6">
                <img src="{% static 'images/nexus-logo-128.png' %}"
                     alt="NExUS logo"
                     class="h-14 w-14 object-contain">
                <h1 class="mt-3 text-2xl font-bold tracking-tight text-primary">Debug login</h1>
                <p class="text-sm text-gray-500">Development sign-in helper</p>
            </div>

            <!-- Debug Info -->
            <div class="bg-accent/30 border border-gold/40 text-primary p-4 rounded-xl mb-6 text-sm">
                <h3 class="font-bold mb-2">Debug Info:</h3>
                <div id="debug-info"></div>
            </div>

            <form method="POST" action="{% url 'login' %}" id="login-form" class="space-y-4" data-nx-skeleton="dashboard">
                {% csrf_token %}

                <div>
                    <label for="debug-username" class="block text-sm font-semibold mb-1 text-gray-700">Username or email</label>
                    <input type="text" name="username" id="debug-username" autocomplete="username" required
                           class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                </div>

                <div>
                    <label for="debug-password" class="block text-sm font-semibold mb-1 text-gray-700">Password</label>
                    <input type="password" name="password" id="debug-password" autocomplete="current-password" required
                           class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                </div>

                <button type="submit"
                        class="w-full bg-primary text-white py-2.5 rounded-lg font-bold hover:bg-secondary transition">
                    Login
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="{% url 'register' %}" class="text-sm font-semibold text-primary hover:text-secondary transition">Register</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const debugInfo = document.getElementById('debug-info');

            // Check cookies
            const cookies = document.cookie.split(';').map(c => c.trim());
            const csrfCookie = cookies.find(c => c.startsWith('csrftoken='));

            // Check form token
            const tokenInput = document.querySelector('input[name="csrfmiddlewaretoken"]');

            let html = `
                <p><strong>Cookies:</strong> ${cookies.length} found</p>
                <p><strong>CSRF Cookie:</strong> ${csrfCookie ? 'Present ✓' : 'Missing ✗'}</p>
                <p><strong>Form Token:</strong> ${tokenInput ? 'Present ✓' : 'Missing ✗'}</p>
            `;

            if (csrfCookie) {
                const tokenValue = csrfCookie.split('=')[1];
                html += `<p><strong>Cookie token (first 10 chars):</strong> ${tokenValue.substring(0, 10)}...</p>`;
            }

            if (tokenInput) {
                html += `<p><strong>Form token (first 10 chars):</strong> ${tokenInput.value.substring(0, 10)}...</p>`;
            }

            debugInfo.innerHTML = html;
        });

        // Prevent double submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            if (submitBtn.disabled) {
                e.preventDefault();
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
