{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Debug Login - NExUS</title>

    <!-- Tailwind CDN + single institutional theme (logo palette + one font) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/nexus-theme.js' %}"></script>

    <!-- One typeface everywhere: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Institutional logo -->
    <link rel="icon" type="image/png" href="{% static 'images/nexus-logo-128.png' %}">

    <link href="{% static 'css/nexus.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md">
            <div class="flex flex-col items-center text-center mb-6">
                <img src="{% static 'images/nexus-logo-128.png' %}"
                     alt="NExUS logo"
                     class="h-14 w-14 object-contain">
                <h2 class="mt-3 text-2xl font-black tracking-tight text-primary">Debug Login</h2>
                <p class="text-sm text-gray-500">Development sign-in helper</p>
            </div>

            <!-- Debug Info -->
            <div class="bg-accent/30 border border-gold/40 text-primary p-4 rounded-xl mb-6 text-sm">
                <h3 class="font-bold mb-2">Debug Info:</h3>
                <div id="debug-info"></div>
            </div>

            <form method="POST" action="{% url 'login' %}" id="login-form" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">Username/Email</label>
                    <input type="text" name="username" required
                           class="nx-input w-full">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">Password</label>
                    <input type="password" name="password" required
                           class="nx-input w-full">
                </div>

                <button type="submit"
                        class="nx-btn nx-btn--primary w-full">
                    Login
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="{% url 'register' %}" class="text-sm font-semibold text-primary hover:text-secondary transition">Register</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const debugInfo = document.getElementById('debug-info');

            // Check cookies
            const cookies = document.cookie.split(';').map(c => c.trim());
            const csrfCookie = cookies.find(c => c.startsWith('csrftoken='));

            // Check form token
            const tokenInput = document.querySelector('input[name="csrfmiddlewaretoken"]');

            let html = `
                <p><strong>Cookies:</strong> ${cookies.length} found</p>
                <p><strong>CSRF Cookie:</strong> ${csrfCookie ? 'Present ✓' : 'Missing ✗'}</p>
                <p><strong>Form Token:</strong> ${tokenInput ? 'Present ✓' : 'Missing ✗'}</p>
            `;

            if (csrfCookie) {
                const tokenValue = csrfCookie.split('=')[1];
                html += `<p><strong>Cookie token (first 10 chars):</strong> ${tokenValue.substring(0, 10)}...</p>`;
            }

            if (tokenInput) {
                html += `<p><strong>Form token (first 10 chars):</strong> ${tokenInput.value.substring(0, 10)}...</p>`;
            }

            debugInfo.innerHTML = html;
        });

        // Prevent double submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            if (submitBtn.disabled) {
                e.preventDefault();
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
