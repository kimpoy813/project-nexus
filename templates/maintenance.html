{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_control.site_name|default:"NExUS" }} Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="{% static 'css/nexus-ui.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <section class="max-w-xl w-full rounded-3xl border border-amber-200 bg-white p-8 shadow-xl text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-amber-50 text-amber-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.276a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085" />
                </svg>
            </div>
            <h1 class="mt-6 text-3xl font-black tracking-tight text-primary">System Maintenance</h1>
            <p class="mt-3 text-sm leading-6 text-gray-600">
                {{ site_control.maintenance_message|default:"NExUS is temporarily under maintenance. Please check back soon." }}
            </p>
            <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                <a href="{% url 'login' %}" class="rounded-2xl bg-primary px-5 py-3 text-sm font-black text-white shadow-sm hover:bg-secondary">
                    Admin Login
                </a>
                <a href="mailto:{{ site_control.contact_email|default:'ispsc.nexus@gmail.com' }}" class="rounded-2xl border border-gray-200 bg-white px-5 py-3 text-sm font-bold text-gray-700 hover:bg-gray-50">
                    Contact Support
                </a>
            </div>
        </section>
    </main>
</body>
</html>
