{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_control.site_name|default:"NExUS" }} Maintenance</title>

    <!-- Tailwind CDN + NExUS theme (Geist type, monochrome palette) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/nexus-theme.js' %}"></script>

    <!-- Geist and Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" referrerpolicy="no-referrer">

    <!-- Institutional logo -->
    <link rel="icon" type="image/png" href="{% static 'images/nexus-logo-128.png' %}">

    <!-- Design foundation + NExUS design layer -->
    <link href="{% static 'css/vercel-brand.css' %}" rel="stylesheet">
    <link href="{% static 'css/nexus-ui.css' %}" rel="stylesheet">
</head>
<body class="vbg-report min-h-screen font-sans">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <section class="max-w-xl w-full rounded-2xl border border-gray-200 bg-white p-8 text-center">
            <img src="{% static 'images/nexus-logo-256.png' %}"
                 alt="NExUS logo"
                 class="mx-auto h-20 w-20 object-contain">
            <h1 class="mt-6 text-3xl font-semibold tracking-tight text-primary">System Maintenance</h1>
            <p class="mt-3 text-sm leading-6 text-gray-600">
                {{ site_control.maintenance_message|default:"NExUS is temporarily under maintenance. Please check back soon." }}
            </p>
            <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                <a href="{% url 'login' %}" class="rounded-lg bg-primary px-5 py-3 text-sm font-semibold text-white">
                    Admin Login
                </a>
                <a href="mailto:{{ site_control.contact_email|default:'ispsc.nexus@gmail.com' }}" class="rounded-lg border border-gray-200 bg-white px-5 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Contact Support
                </a>
            </div>
        </section>
    </main>
</body>
</html>
