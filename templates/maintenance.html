{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_control.site_name|default:"NExUS" }} Maintenance</title>

    <!-- Tailwind CDN + single institutional theme (logo palette + one font) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/nexus-theme.js' %}"></script>

    <!-- One typeface everywhere: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Institutional logo -->
    <link rel="icon" type="image/png" href="{% static 'images/nexus-logo-128.png' %}">

    <link href="{% static 'css/nexus.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 font-sans">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <section class="max-w-xl w-full rounded-3xl border border-amber-200 bg-white p-8 shadow-xl text-center">
            <img src="{% static 'images/nexus-logo-256.png' %}"
                 alt="NExUS logo"
                 class="mx-auto h-20 w-20 object-contain">
            <h1 class="mt-6 text-3xl font-black tracking-tight text-primary">System Maintenance</h1>
            <p class="mt-3 text-sm leading-6 text-gray-600">
                {{ site_control.maintenance_message|default:"NExUS is temporarily under maintenance. Please check back soon." }}
            </p>
            <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                <a href="{% url 'login' %}" class="nx-btn nx-btn--primary nx-btn--lg">
                    Admin Login
                </a>
                <a href="mailto:{{ site_control.contact_email|default:'ispsc.nexus@gmail.com' }}" class="nx-btn nx-btn--lg border-gray-200">
                    Contact Support
                </a>
            </div>
        </section>
    </main>
</body>
</html>
