{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#103b07">
    <title>{{ site_control.site_name|default:"NExUS" }} — Maintenance</title>
    <link href="{% static 'css/nexus-tailwind.css' %}" rel="stylesheet">
    <link rel="preload" href="{% static 'fonts/public-sans-latin-variable.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'fonts/manrope-latin-variable.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" href="{% static 'images/nexus-logo-128.png' %}">
    <link href="{% static 'css/nexus-ui.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 font-sans">
    <main class="min-h-[100dvh] flex items-center justify-center px-4 py-12">
        <section class="nx-not-found w-full text-left" aria-labelledby="maintenance-title">
            <img src="{% static 'images/nexus-logo-256.png' %}" alt="NExUS" class="h-14 w-14 object-contain">
            <p class="nx-not-found__code mt-7">Service notice / Temporary</p>
            <h1 id="maintenance-title">NExUS is under maintenance.</h1>
            <p>{{ site_control.maintenance_message|default:"NExUS is temporarily under maintenance. Please check back soon." }}</p>
            <div class="nx-not-found__actions">
                <a href="{% url 'login' %}" class="nexus-btn-primary">Administrator sign in</a>
                <a href="mailto:{{ site_control.contact_email|default:'ispsc.nexus@gmail.com' }}" class="nexus-btn-secondary">Contact the extension office</a>
            </div>
        </section>
    </main>
</body>
</html>
