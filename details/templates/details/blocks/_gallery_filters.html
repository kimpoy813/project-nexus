{% comment %}
Filters & Sort bar for the Program Gallery (source key GALLERY).

Lives in its own underscore-prefixed partial because standalone page templates
that contain a <select> must extend templates/base.html directly.

Context: section, data.filter_options, data.stats
{% endcomment %}
<div id="gallery-filters"
     class="scroll-mt-32 mt-8 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm nx-panel print:hidden">

    <!-- Filter header + Reset -->
    <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
            <h3 class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">Filters</h3>
            <span class="rounded-full px-2.5 py-0.5 text-xs font-medium"
                  :class="hasActiveFilters() ? 'bg-primary/10 text-primary' : 'bg-gray-100 text-gray-500'"
                  x-text="hasActiveFilters() ? (activeFilterCount() + ' active') : 'no filters applied'">no filters applied</span>
        </div>

        <button type="button" @click="reset()"
                class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-semibold text-gray-700 transition hover:bg-gray-50 nx-btn nx-btn--secondary nx-btn--compact">
            Reset
        </button>
    </div>

    <!-- Search input -->
    <div class="mt-4">
        <label for="gallery-search-{{ section.id|default:'preview' }}" class="sr-only">Search gallery photos</label>
        <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
            </svg>
            <input id="gallery-search-{{ section.id|default:'preview' }}"
                   type="search"
                   x-model="q"
                   @input="apply()"
                   placeholder='Search caption, program, or campus… ("quotes" = exact phrase)'
                   class="w-full rounded-xl border border-gray-300 bg-white py-2.5 pl-10 pr-9 text-sm text-gray-800 placeholder-gray-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 nx-control">
            <button type="button"
                    x-show="q !== ''"
                    x-cloak
                    @click="q = ''; apply()"
                    aria-label="Clear search"
                    class="absolute right-2.5 top-1/2 -translate-y-1/2 rounded-md p-1 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700">
                ✕
            </button>
        </div>
    </div>

    <!-- Filter & Sort selectors -->
    <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <div>
            <label for="gallery-campus-{{ section.id|default:'preview' }}" class="sr-only">Filter by campus</label>
            <select id="gallery-campus-{{ section.id|default:'preview' }}"
                    x-model="campus"
                    @change="apply()"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 nx-control">
                <option value="">Campus: all</option>
                {% for option in data.filter_options.campuses %}
                <option value="{{ option.key }}">{{ option.label }} ({{ option.count }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="gallery-year-{{ section.id|default:'preview' }}" class="sr-only">Filter by year</label>
            <select id="gallery-year-{{ section.id|default:'preview' }}"
                    x-model="year"
                    @change="apply()"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 nx-control">
                <option value="">Year: all</option>
                {% for option in data.filter_options.years %}
                <option value="{{ option.value }}">{{ option.label }} ({{ option.count }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="gallery-source-{{ section.id|default:'preview' }}" class="sr-only">Filter by source</label>
            <select id="gallery-source-{{ section.id|default:'preview' }}"
                    x-model="source"
                    @change="apply()"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 nx-control">
                <option value="">Source: all</option>
                {% for option in data.filter_options.sources %}
                <option value="{{ option.value }}">{{ option.label }} ({{ option.count }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="gallery-sort-{{ section.id|default:'preview' }}" class="sr-only">Sort photos</label>
            <select id="gallery-sort-{{ section.id|default:'preview' }}"
                    x-model="sortBy"
                    @change="apply()"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 nx-control">
                <option value="newest">Sort: newest first</option>
                <option value="oldest">Sort: oldest first</option>
                <option value="program_asc">Sort: program A–Z</option>
                <option value="campus_asc">Sort: campus A–Z</option>
            </select>
        </div>
    </div>
</div>
