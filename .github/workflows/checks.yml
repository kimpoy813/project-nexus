name: System checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - name: Generated assets must match their sources
        run: git diff --exit-code -- static/goey static/vendor static/css/nexus-utilities.css
      - run: node --test tests/*.test.cjs
      - run: python manage.py check --settings=conf.settings_test
      - run: python manage.py makemigrations --check --dry-run --settings=conf.settings_test
      - run: python manage.py test --settings=conf.settings_test
      - run: python manage.py collectstatic --noinput
