# Replace BOTH occurrences of example.com before enabling this site.
# Certbot adds HTTPS after DNS points to the VPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Adjust only if the application needs larger uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrite client-supplied values: Django trusts this header.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
