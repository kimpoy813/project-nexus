{% comment %}
Section: budget. Rendered inside the wizard form by step.html;
the surrounding header, admin-built fields and navigation are shared.
{% endcomment %}
<div>
    <label for="budgetary_requirement" class="block text-sm font-semibold text-gray-900">
        {{ step_fields.budgetary_requirement.label|default:"Budgetary Requirement" }}{% if step_fields.budgetary_requirement.required %} <span class="text-red-600">*</span>{% endif %}
    </label>
    <p class="text-xs text-gray-500 mt-1">
        {{ step_fields.budgetary_requirement.help_text|default:"Enter the funding source and amount, if applicable." }}
    </p>

    <div class="mt-3">
        <input
            type="text"
            id="budgetary_requirement"
            name="budgetary_requirement"
            value="{{ budgetary_requirement|default:'' }}"
            {% if not is_edit_mode %}readonly{% endif %}
            class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none {% if is_edit_mode %}focus:ring-2 focus:ring-primary focus:border-primary{% else %}bg-gray-50 text-gray-700{% endif %}"
            placeholder="{{ step_fields.budgetary_requirement.placeholder|default:'e.g. Candon City LGU Fund or CTE Fund 30,000' }}"
        >
    </div>
</div>
