<div class="legacy-field{% if wide %} legacy-wide{% endif %}"{% if wrapper_id %} id="{{ wrapper_id }}"{% endif %}>
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %} <span class="legacy-required">*</span>{% endif %}</label>
  {{ field }}
  {% if help %}<p class="legacy-help" id="{{ field.auto_id }}_helptext">{{ help }}</p>{% endif %}
  {{ field.errors }}
</div>
