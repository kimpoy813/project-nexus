{% extends "services/wizard/_wizard_shell.html" %}
{% load proposal_extras %}

{% block wizard_form %}
{% include "services/wizard/_step_header.html" %}
<div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
  <form method="POST" enctype="multipart/form-data" class="px-6 pb-6 pt-1 space-y-6">
    {% csrf_token %}

    <div>
      <label for="technology_title" class="block text-sm font-semibold text-gray-900 mb-2">Title of Technology</label>
      <input type="text" id="technology_title" name="technology_title" value="{{ technology_title }}"
             {% if not is_edit_mode %}readonly{% endif %}
             class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none {% if is_edit_mode %}focus:ring-2 focus:ring-primary focus:border-primary bg-white{% else %}bg-gray-50 text-gray-700{% endif %}">
    </div>

    <div>
      <label for="utility_model_registration_number" class="block text-sm font-semibold text-gray-900 mb-2">Utility Model Registration Number</label>
      <input type="text" id="utility_model_registration_number" name="utility_model_registration_number" value="{{ utility_model_registration_number }}"
             {% if not is_edit_mode %}readonly{% endif %}
             class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none {% if is_edit_mode %}focus:ring-2 focus:ring-primary focus:border-primary bg-white{% else %}bg-gray-50 text-gray-700{% endif %}">
    </div>

    <div>
      <label for="utility_model_description" class="block text-sm font-semibold text-gray-900 mb-2">Utility Model Description</label>
      <textarea id="utility_model_description" name="utility_model_description" rows="4"
                {% if not is_edit_mode %}readonly{% endif %}
                class="w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none {% if is_edit_mode %}focus:ring-2 focus:ring-primary focus:border-primary{% else %}bg-gray-50 text-gray-700{% endif %}">{{ utility_model_description }}</textarea>
    </div>

    {% include "services/wizard/_dynamic_fields.html" %}

    {% if is_edit_mode %}
    <div class="flex flex-col sm:flex-row gap-2 pt-2">
      <button name="action" value="back" class="px-4 py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50 transition" type="submit">Back</button>
      <button name="action" value="skip" class="px-4 py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50 transition" type="submit">Skip</button>
      <button name="action" value="next" class="px-4 py-2.5 rounded-xl bg-primary text-white hover:bg-secondary transition sm:ml-auto" type="submit">Save &amp; Next</button>
    </div>
    {% else %}
    <div class="flex justify-end pt-2">
      <a href="{% url 'proposal_wizard' proposal.id step|add:1 %}{% if request.GET.readonly %}?readonly=1{% endif %}" class="px-4 py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50 transition">Next Step</a>
    </div>
    {% endif %}
  </form>
</div>
{% endblock %}
